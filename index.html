<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Média</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Calculadora de Média</h1>
        
        <!-- Formulário de Entrada de Dados -->
        <div class="input-group">
            <label for="nota1">Nota 1:</label>
            <input type="number" id="nota1" placeholder="Digite a 1ª nota" step="0.1" min="0" max="10">
        </div>

        <div class="input-group">
            <label for="nota2">Nota 2:</label>
            <input type="number" id="nota2" placeholder="Digite a 2ª nota" step="0.1" min="0" max="10">
        </div>

        <div class="input-group">
            <label for="nota3">Nota 3:</label>
            <input type="number" id="nota3" placeholder="Digite a 3ª nota" step="0.1" min="0" max="10">
        </div>

        <button id="btn-calcular">Calcular Média</button>

        <!-- Feedback Visual (Área de Resultado) -->
        <div id="resultado" class="hidden">
            <p id="texto-media"></p>
            <p id="texto-status"></p>
        </div>
    </div>

    <script src="/nathyy/script.js"></script>
</body>
</html>
